name = "bilibili-live-frontend"
main = "_worker.js"
compatibility_date = "2026-07-19"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
BACKEND_URL = "https://live-api.ctn32.us.kg"
